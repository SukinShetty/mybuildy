# mac-signed-build.yml — manual test of Mac signing and notarization.
#
# Run from the Actions tab (or `gh workflow run mac-signed-build.yml`). Builds
# both DMGs (Apple Silicon + Intel) exactly as release.yml does — Developer ID
# signed with the hardened runtime, each .app and each DMG notarized and
# stapled, every signature and ticket checked — and uploads them as WORKFLOW
# ARTIFACTS ONLY. It never creates, edits or uploads to a release, and needs no
# tag. Use it to hand a signed build to a Mac tester.

name: Mac signed build (test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-signed-dmg:
    if: github.repository == 'SukinShetty/mybuildy'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is required (same as ci.yml and release.yml).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Buildy's voice model
        uses: actions/cache@v4
        with:
          path: resources/kokoro
          key: kokoro-fp16-1939ad2a8e416c0acfeecc08a694d14ef25f2231

      - name: Fetch Buildy's voice model (pinned revision, SHA-256 checked)
        run: npm run fetch:voice

      - name: Build
        run: npm run build

      - name: Package macOS DMGs (arm64 + x64), signed and notarized
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      - name: Notarize and staple the DMGs; verify every signature
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/mac-notarize-dmgs.sh

      # Run the signed, notarized apps: Buildy's voice engine must load inside
      # each of them (Apple Silicon natively; Intel under Rosetta when available).
      - name: Buildy's voice loads inside the signed apps
        run: |
          MYBUILDY_E2E_EXE="$PWD/dist/mac-arm64/MyBuildy.app/Contents/MacOS/MyBuildy" npx playwright test e2e/buildy-voice.spec.ts
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            MYBUILDY_E2E_EXE="$PWD/dist/mac/MyBuildy.app/Contents/MacOS/MyBuildy" npx playwright test e2e/buildy-voice.spec.ts
          else
            echo "Rosetta is not available on this runner: the Intel app's engine signature is checked above, not run."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mybuildy-mac-signed-dmgs
          path: dist/MyBuildy-*.dmg
          if-no-files-found: error
          retention-days: 30
