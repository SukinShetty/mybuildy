name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # macos-latest proves the app type-checks, passes its unit tests and builds
    # on macOS on every push, before a human ever touches a Mac build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is required: npm 10+ crashes with an arborist "edgesOut"
      # error on a clean install without it, even though every peer resolves.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fails if GPL / AGPL (or LGPL, non-commercial, unknown-licence) code would
      # ship, including eSpeak NG hidden inside a package, or if
      # THIRD_PARTY_NOTICES.md misses a shipped package.
      - name: Licence check (dependencies + built bundles)
        run: node scripts/check-licences.mjs --out out --report licence-report-${{ runner.os }}.md

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: licence-report
          path: licence-report-*.md
          if-no-files-found: ignore

      - name: Test
        run: npm test

  # The Playwright Electron suite on a clean Windows machine: dev build, then the
  # packaged app (dist/win-unpacked/MyBuildy.exe). Independent of the release
  # workflow, so a runner hiccup here can never block cutting a draft release.
  e2e-windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Buildy's voice model
        uses: actions/cache@v4
        with:
          path: resources/kokoro
          key: kokoro-fp16-1939ad2a8e416c0acfeecc08a694d14ef25f2231

      - name: Fetch Buildy's voice model (pinned revision, SHA-256 checked)
        run: npm run fetch:voice

      # The "MyBuildy" wake word with the real on-device listening model on this OS:
      # synthetic clips through the real segmenter + matcher. Informational (numbers
      # in the log and artifact), so a slow runner can't block the build.
      - name: Wake word eval (real model, quick)
        continue-on-error: true
        run: node --experimental-strip-types scripts/eval-wake-word.mjs --quick --out wake-eval-${{ runner.os }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-eval-${{ runner.os }}
          path: wake-eval-*.json
          if-no-files-found: ignore

      - name: E2E (dev build)
        run: npm run test:e2e

      # Real Windows windows and keystrokes: two windows with the same title,
      # and Paste into terminal must reach only the picked one (or nothing).
      - name: Paste goes only to the picked window (real Windows)
        run: npx vitest run src/main/paste-target.windows.test.ts

      - name: Package Windows app
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Licence check (the packaged Windows app)
        run: node scripts/check-licences.mjs --out out --app dist/win-unpacked/resources

      - name: Installer size
        shell: bash
        run: ls -l dist/MyBuildy-Setup-*.exe dist/win-unpacked/resources/app.asar && du -sb dist/win-unpacked/resources/* | sort -n

      # The in-app update check needs these: the feed next to the installer and
      # the updater config inside the app (from package.json build.publish).
      - name: Update feed and updater config are generated
        shell: bash
        run: |
          set -e
          cat dist/latest.yml
          grep -q "MyBuildy-Setup-.*\.exe" dist/latest.yml
          ls dist/MyBuildy-Setup-*.exe.blockmap
          cat dist/win-unpacked/resources/app-update.yml
          grep -q "provider: github" dist/win-unpacked/resources/app-update.yml
          grep -q "repo: mybuildy" dist/win-unpacked/resources/app-update.yml

      - name: E2E (packaged app)
        run: npm run test:e2e:packaged

      # Test candidates only: no tags, Releases API, or public download changes.
      - name: Prepare test installer identity and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-artifacts -Force | Out-Null
          $installers = @(Get-ChildItem dist/MyBuildy-Setup-*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one test installer.' }
          Copy-Item $installers[0].FullName test-artifacts/
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA) { throw 'Checkout SHA does not match this workflow run.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = $installers[0].Name
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content test-artifacts/SHA256SUMS.txt -Encoding ascii
          @{
            source_commit = $source
            package_version = $version
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            purpose = 'Unreleased Windows test candidate, not a public release.'
            filename = $name
            sha256 = $hash
            signing = 'Unsigned'
            profile_warning = 'Same app identity and version as public MyBuildy. Installing can replace the existing app and uses its existing profile. Filename is not proof of source identity.'
          } | ConvertTo-Json | Set-Content test-artifacts/BUILD-SOURCE.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: mybuildy-windows-test-${{ github.sha }}
          path: test-artifacts/*
          if-no-files-found: error
          retention-days: 7

  # The same Playwright Electron suite (dev build) on macOS: the setup wizard's
  # Windows and Mac paths both run here too (src/main/e2e-fakes.ts), next to the
  # real macOS behaviour of every other spec.
  e2e-macos:
    runs-on: macos-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Buildy's voice model
        uses: actions/cache@v4
        with:
          path: resources/kokoro
          key: kokoro-fp16-1939ad2a8e416c0acfeecc08a694d14ef25f2231

      - name: Fetch Buildy's voice model (pinned revision, SHA-256 checked)
        run: npm run fetch:voice

      # The "MyBuildy" wake word with the real on-device listening model on this OS:
      # synthetic clips through the real segmenter + matcher. Informational (numbers
      # in the log and artifact), so a slow runner can't block the build.
      - name: Wake word eval (real model, quick)
        continue-on-error: true
        run: node --experimental-strip-types scripts/eval-wake-word.mjs --quick --out wake-eval-${{ runner.os }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-eval-${{ runner.os }}
          path: wake-eval-*.json
          if-no-files-found: ignore

      - name: E2E (dev build)
        run: npm run test:e2e

      # Unsigned test packaging (no Apple certificate here; after-pack.js ad-hoc
      # signs): the licence check runs on both real Mac apps, and the voice
      # engine must load inside the Apple Silicon app. Nothing is uploaded.
      - name: Package Mac apps (unsigned test build, arm64 + x64, dmg + zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Licence check (the packaged Mac apps)
        run: |
          node scripts/check-licences.mjs --out out --app dist/mac-arm64/MyBuildy.app/Contents/Resources
          node scripts/check-licences.mjs --out out --app dist/mac/MyBuildy.app/Contents/Resources

      - name: Mac package sizes
        run: ls -l dist/*.dmg dist/*.zip && du -sk dist/mac-arm64/MyBuildy.app/Contents/Resources/* dist/mac/MyBuildy.app/Contents/Resources/* | sort -n | tail -20

      - name: Buildy's voice loads inside the packaged Apple Silicon app
        run: MYBUILDY_E2E_EXE="$PWD/dist/mac-arm64/MyBuildy.app/Contents/MacOS/MyBuildy" npx playwright test e2e/buildy-voice.spec.ts
