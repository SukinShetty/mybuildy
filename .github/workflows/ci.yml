name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # macos-latest proves the app type-checks, passes its unit tests and builds
    # on macOS on every push, before a human ever touches a Mac build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is required: npm 10+ crashes with an arborist "edgesOut"
      # error on a clean install without it, even though every peer resolves.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The Playwright Electron suite on a clean Windows machine: dev build, then the
  # packaged app (dist/win-unpacked/MyBuildy.exe). Independent of the release
  # workflow, so a runner hiccup here can never block cutting a draft release.
  e2e-windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Buildy's voice model
        uses: actions/cache@v4
        with:
          path: resources/kokoro
          key: kokoro-fp16-1939ad2a8e416c0acfeecc08a694d14ef25f2231

      - name: Fetch Buildy's voice model (pinned revision, SHA-256 checked)
        run: npm run fetch:voice

      - name: E2E (dev build)
        run: npm run test:e2e

      # Real Windows windows and keystrokes: two windows with the same title,
      # and Paste into terminal must reach only the picked one (or nothing).
      - name: Paste goes only to the picked window (real Windows)
        run: npx vitest run src/main/paste-target.windows.test.ts

      - name: Package Windows app
        run: npx electron-builder --win nsis --x64 --publish never

      - name: E2E (packaged app)
        run: npm run test:e2e:packaged

      # Test candidates only: no tags, Releases API, or public download changes.
      - name: Prepare test installer identity and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-artifacts -Force | Out-Null
          $installers = @(Get-ChildItem dist/MyBuildy-Setup-*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one test installer.' }
          Copy-Item $installers[0].FullName test-artifacts/
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA) { throw 'Checkout SHA does not match this workflow run.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = $installers[0].Name
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content test-artifacts/SHA256SUMS.txt -Encoding ascii
          @{
            source_commit = $source
            package_version = $version
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            purpose = 'Unreleased Windows test candidate, not a public release.'
            filename = $name
            sha256 = $hash
            signing = 'Unsigned'
            profile_warning = 'Same app identity and version as public MyBuildy. Installing can replace the existing app and uses its existing profile. Filename is not proof of source identity.'
          } | ConvertTo-Json | Set-Content test-artifacts/BUILD-SOURCE.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: mybuildy-windows-test-${{ github.sha }}
          path: test-artifacts/*
          if-no-files-found: error
          retention-days: 7

  # The same Playwright Electron suite (dev build) on macOS: the setup wizard's
  # Windows and Mac paths both run here too (src/main/e2e-fakes.ts), next to the
  # real macOS behaviour of every other spec.
  e2e-macos:
    runs-on: macos-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Buildy's voice model
        uses: actions/cache@v4
        with:
          path: resources/kokoro
          key: kokoro-fp16-1939ad2a8e416c0acfeecc08a694d14ef25f2231

      - name: Fetch Buildy's voice model (pinned revision, SHA-256 checked)
        run: npm run fetch:voice

      - name: E2E (dev build)
        run: npm run test:e2e
